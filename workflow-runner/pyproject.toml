[project]
name = "ai-script-workflow-runner"
version = "0.1.0"
description = "Python DAG and Skill execution service for AI Script"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "pymysql>=1.1,<2",
  "redis>=5.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
workflow-runner = "app.main:run"
workflow-worker = "app.workers.command_consumer:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
