spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

app:
  auth:
    wechat:
      enabled: ${WECHAT_LOGIN_ENABLED:false}
      app-id: ${WECHAT_LOGIN_APP_ID:}
      app-secret: ${WECHAT_LOGIN_APP_SECRET:}
      callback-url: ${WECHAT_LOGIN_CALLBACK_URL:http://localhost:8080/api/auth/wechat/callback}
  jwt:
    secret: ${JWT_SECRET:change-me-provider-secret-cipher-key}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:720}
  secret:
    cipher-key: ${APP_SECRET_CIPHER_KEY:change-me-provider-secret-cipher-key}
  storage:
    provider: ${STORAGE_PROVIDER:aliyun-oss}
    endpoint: ${STORAGE_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    bucket: ${STORAGE_BUCKET:rxbtanhua}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    region: ${STORAGE_REGION:cn-hangzhou}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    local-path: ${STORAGE_LOCAL_PATH:/opt/ai-script/uploads}
  ocr:
    enabled: ${OCR_ENABLED:true}
    provider: ${OCR_PROVIDER:aliyun}
    fallback-to-tesseract: ${OCR_FALLBACK_TO_TESSERACT:true}
    command: ${OCR_COMMAND:tesseract}
    language: ${OCR_LANGUAGE:chi_sim+eng}
    page-segmentation-mode: ${OCR_PAGE_SEGMENTATION_MODE:6}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:30}
    max-text-length: ${OCR_MAX_TEXT_LENGTH:30000}
    aliyun:
      access-key-id: ${STORAGE_ACCESS_KEY:}
      access-key-secret: ${STORAGE_SECRET_KEY:}
      endpoint: ocr-api.cn-hangzhou.aliyuncs.com
      region-id: cn-hangzhou
      connect-timeout-millis: ${ALIYUN_OCR_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${ALIYUN_OCR_READ_TIMEOUT_MILLIS:30000}
      max-file-size-bytes: ${ALIYUN_OCR_MAX_FILE_SIZE_BYTES:10485760}
