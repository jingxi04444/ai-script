spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:120}
  secret:
    cipher-key: ${APP_SECRET_CIPHER_KEY}
  storage:
    provider: ${STORAGE_PROVIDER:aliyun-oss}
    endpoint: ${STORAGE_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    bucket: ${STORAGE_BUCKET:datalefoss}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    region: ${STORAGE_REGION:cn-hangzhou}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    local-path: ${STORAGE_LOCAL_PATH:/opt/ai-script/uploads}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    custom-domain: ${ALIYUN_OSS_CUSTOM_DOMAIN:}
    dir-prefix: ${ALIYUN_OSS_DIR_PREFIX:}
