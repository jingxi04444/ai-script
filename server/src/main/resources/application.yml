# ============================================================
# AI Script 服务端主配置文件
# 作用：定义 Spring Boot 应用的基础行为、持久层、接口文档、监控、支付、短信等公共配置
# 环境切换：通过 spring.profiles.active 指定 dev / prod，具体环境参数在对应文件中覆盖
# ============================================================

# 服务端口配置
server:
  port: 8080  # 应用监听端口，本地访问 http://localhost:8080

# Spring 应用基础配置
spring:
  application:
    name: ai-script-server  # 应用名称，用于日志、监控、服务注册等
  profiles:
    active: prod  # 默认激活的环境：prod=生产，dev=本地开发；启动时可用 --spring.profiles.active=dev 覆盖
  servlet:
    multipart:
      max-file-size: 300MB   # 单个上传文件最大限制
      max-request-size: 300MB  # 单次请求（含多个文件）最大限制

# MyBatis-Plus 持久层配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml  # Mapper XML 文件扫描路径
  type-aliases-package: com.aiscript.modules.*.entity  # 实体类包路径，用于 XML 中简化类型名
  global-config:
    db-config:
      id-type: auto  # 主键生成策略：auto 表示使用数据库自增或雪花算法
      logic-delete-field: deleted  # 逻辑删除字段名
      logic-delete-value: 1  # 已删除标记值
      logic-not-delete-value: 0  # 未删除标记值
  configuration:
    map-underscore-to-camel-case: true  # 自动将数据库下划线命名映射为 Java 驼峰命名
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # SQL 日志输出到 slf4j

# Knife4j / OpenAPI 接口文档配置
springdoc:
  api-docs:
    enabled: true  # 是否启用 /v3/api-docs 接口文档 JSON
  swagger-ui:
    enabled: true  # 是否启用 Swagger UI 页面（开发/测试常用）

# Spring Boot Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info  # 对外暴露健康检查和基本信息接口

# AI Script 业务配置
aiscript:
  recycle-bin:
    retention-days: ${RECYCLE_BIN_RETENTION_DAYS:7}  # 回收站默认保留天数
    cleanup-cron: "${RECYCLE_BIN_CLEANUP_CRON:0 20 3 * * ?}"  # 每天 03:20 清理过期内容
  exports:
    retention-days: ${EXPORT_RETENTION_DAYS:7}  # 批量下载文件保留天数
    cleanup-cron: "${EXPORT_CLEANUP_CRON:0 40 3 * * ?}"  # 每天 03:40 清理过期导出文件
